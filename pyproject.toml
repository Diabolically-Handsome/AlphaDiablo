[project]
name = "diablogym"
version = "0.1.0"
description = "AlphaDiablo: a fast, deterministic Diablo I reinforcement-learning environment built on DevilutionX (headless engine, Gymnasium API)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Diabolically-Handsome" }]
keywords = ["reinforcement-learning", "gymnasium", "diablo", "devilutionx", "game-ai"]

dependencies = [
  "numpy==2.5.0",
  "gymnasium==1.3.0",
]

[project.optional-dependencies]
train = [
  "torch==2.12.1",
  # train/leashed_ppo.py re-implements MaskablePPO.train of 2.9.0 line by line; upgrading needs a new
  # equivalence audit against upstream, so a fresh install cannot silently change the training algorithm.
  "stable-baselines3==2.9.0",
  "sb3-contrib==2.9.0",
  "tensorboard==2.21.0",
  "matplotlib==3.11.0", # train/plot_figures.py (regenerates the README figures)
]
build = [
  "pybind11==3.0.4",
]

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["diablogym"]
